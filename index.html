<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#080b12">

    <title>Solana Command Center</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(circle at 20% 0%, #17213a 0, transparent 35%),
                radial-gradient(circle at 90% 20%, #24143b 0, transparent 30%),
                #080b12;
            color: #f5f7ff;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: linear-gradient(to bottom, black, transparent);
        }

        .container {
            width: min(1100px, calc(100% - 28px));
            margin: 0 auto;
            padding: 35px 0 60px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
        }

        .title {
            font-size: clamp(28px, 6vw, 48px);
            font-weight: 800;
            letter-spacing: -2px;
            margin: 0;
        }

        .subtitle {
            color: #7e8aa8;
            margin-top: 7px;
            font-size: 14px;
        }

        button {
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 12px;
            padding: 13px 19px;
            color: white;
            background: rgba(255,255,255,.07);
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            backdrop-filter: blur(15px);
            transition: .2s;
        }

        button:hover {
            background: rgba(255,255,255,.13);
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: .5;
            cursor: wait;
        }

        .hero {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 25px;
            background: linear-gradient(
                135deg,
                rgba(30,40,70,.75),
                rgba(15,18,30,.72)
            );
            box-shadow: 0 25px 80px rgba(0,0,0,.35);
            backdrop-filter: blur(20px);
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 250px;
            height: 250px;
            right: -100px;
            top: -120px;
            background: #6d4aff;
            filter: blur(100px);
            opacity: .22;
        }

        .hero-label {
            color: #8995b3;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .grand-total {
            font-size: clamp(38px, 9vw, 68px);
            font-weight: 800;
            letter-spacing: -3px;
            margin: 8px 0;
        }

        .usd-total {
            font-size: 20px;
            color: #9da9c4;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 25px;
        }

        .stat {
            background: rgba(255,255,255,.045);
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 14px;
            padding: 14px;
        }

        .stat-label {
            color: #7d89a5;
            font-size: 12px;
        }

        .stat-value {
            margin-top: 5px;
            font-size: 18px;
            font-weight: 700;
        }

        .wallet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 14px;
        }

        .wallet {
            position: relative;
            overflow: hidden;
            border-radius: 18px;
            padding: 19px;
            background: rgba(17,21,32,.82);
            border: 1px solid rgba(255,255,255,.075);
            box-shadow: 0 10px 35px rgba(0,0,0,.2);
            transition: .2s;
        }

        .wallet:hover {
            transform: translateY(-2px);
            border-color: rgba(255,255,255,.16);
        }

        .wallet.main {
            grid-column: 1 / -1;
            background: linear-gradient(
                135deg,
                rgba(48,37,86,.8),
                rgba(17,21,32,.9)
            );
            border-color: rgba(143,111,255,.35);
        }

        .wallet.safe {
            border-left: 3px solid #25e69a;
        }

        .wallet.low {
            border-left: 3px solid #ff426d;
        }

        .wallet-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .wallet-name {
            font-size: 17px;
            font-weight: 800;
        }

        .badge {
            font-size: 10px;
            padding: 5px 8px;
            border-radius: 999px;
            background: rgba(255,255,255,.07);
            color: #aab4ca;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .safe .badge {
            color: #25e69a;
            background: rgba(37,230,154,.08);
        }

        .low .badge {
            color: #ff426d;
            background: rgba(255,66,109,.08);
        }

        .pubkey {
            margin: 10px 0 18px;
            color: #626d87;
            font-size: 10px;
            word-break: break-all;
        }

        .balances {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .balance-box {
            padding: 11px;
            border-radius: 11px;
            background: rgba(255,255,255,.035);
        }

        .balance-label {
            color: #707b95;
            font-size: 10px;
            text-transform: uppercase;
        }

        .balance-value {
            margin-top: 5px;
            font-size: 13px;
            font-weight: 700;
        }

        .wallet-usd {
            margin-top: 13px;
            color: #8d99b5;
            font-size: 13px;
        }

        .status {
            margin-top: 20px;
            color: #69748e;
            font-size: 11px;
        }

        @media (max-width: 600px) {
            .container {
                padding-top: 20px;
            }

            .header {
                align-items: flex-start;
            }

            .header button {
                padding: 11px;
                font-size: 12px;
            }

            .hero {
                padding: 22px;
            }

            .wallet.main {
                grid-column: auto;
            }

            .balances {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <h1 class="title">SOL // COMMAND</h1>
            <div class="subtitle">Multi-wallet portfolio monitor</div>
        </div>

        <button id="fetchBtn">↻ REFRESH</button>
    </div>

    <section class="hero">
        <div class="hero-label">Portfolio Value</div>

        <div class="grand-total" id="grandTotal">
            ---
        </div>

        <div class="usd-total" id="usdTotal">
            $---
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">SOL PRICE</div>
                <div class="stat-value" id="solPrice">$---</div>
            </div>

            <div class="stat">
                <div class="stat-label">WALLETS</div>
                <div class="stat-value">21</div>
            </div>
        </div>

        <div class="status" id="status">
            Awaiting refresh...
        </div>
    </section>

    <div class="wallet-grid" id="wallets"></div>

</div>

<script>

const RPC =
    "https://mainnet.helius-rpc.com/?api-key=effd806d-2126-4b17-b69d-a68f37ace363";

const WSOL_MINT =
    "So11111111111111111111111111111111111111112";

const wallets = [
    {
        index: "MAIN",
        publicKey: "nigger24aL9gzjedPYg8kCACtYiWrjDiiBiUptCiXZ6"
    },
    {
        index: 0,
        publicKey: "5uA5SaRfAL27TJeRP7ZJfqRmKrhDudB69o4CvcHMeJsm"
    },
    {
        index: 1,
        publicKey: "2qKNMo7nu3C4mYCnEGbxndhtszUq3n88ebfqRPswwbZ2"
    },
    {
        index: 2,
        publicKey: "Ew5ZvEchSaGhc8N5AMMYKAw2ueh8swvEVnwQS3TwUk7K"
    },
    {
        index: 3,
        publicKey: "4sUmdEpoCAc3XLFr9icSd915f3Ei99RNhm7iVBBqKqzA"
    },
    {
        index: 4,
        publicKey: "EZpyfQf5QLLJQHazyMRtzCMQ5ixPmvadkPzbWv3uaex5"
    },
    {
        index: 5,
        publicKey: "25CbzG2mhFMJYhdXyjyG32tvWAPjZFfwuPcwpCyhY4mk"
    },
    {
        index: 6,
        publicKey: "HnzQ5akcvt7FLfd9HuvP7AdBBKajcKhQAZi8kqTeetUw"
    },
    {
        index: 7,
        publicKey: "dXmbCoMokJAdxvx4s2MusDSfPz5E1kfeLbFm1TtRDJJ"
    },
    {
        index: 8,
        publicKey: "AToGrNDmKQhoeG5U83m3CY8rXc3jyLEZ3H5GMVr8QYcf"
    },
    {
        index: 9,
        publicKey: "AoF4mzAFMswVQxMoUa9PvMuJYaNMiuhj4rhe6h6dmKAz"
    },
    {
        index: 10,
        publicKey: "4zQnKSf3gF2F3Av2MeTxkmMo57sSFvMZmZRDQyx3GFZ6"
    },
    {
        index: 11,
        publicKey: "DXADrcqr8UDChmNXcJLsFC7ojkaqShbaNHP1rao68EUs"
    },
    {
        index: 12,
        publicKey: "BKZ6JFtBMYhNiWYHwS96KkYgAHWtCKLK2fVZaxgPUSju"
    },
    {
        index: 13,
        publicKey: "2NDYEAwuee5EUjK7CvB8wSPvQsZprXxzPm2g6PGAj3CT"
    },
    {
        index: 14,
        publicKey: "BLSVRrdERqS1LPP4tyJ2HYghByghWRSnoiojm22C2czz"
    },
    {
        index: 15,
        publicKey: "69J2HyLoXLbCzLANV4cFqydGLbkqypt51XrJPqvVwWVS"
    },
    {
        index: 16,
        publicKey: "5ovAXA8fTWLvKesenhwwv58owis9UdcBamo9xqVgBSnz"
    },
    {
        index: 17,
        publicKey: "3rBLhz6ZieNP2Wq3v6cHyJ6nx3q6aey28b3Gr7DMkvKW"
    },
    {
        index: 18,
        publicKey: "42pAHoNqWq5qKYLTy8XmJdcvBMDweDd1ejdLXwZVWwob"
    },
    {
        index: 19,
        publicKey: "FNM1d5H7XskgpDQNz9Dnmw5uRvkPAJ9iM2c7LFy3cZNJ"
    }
];

const walletsContainer =
    document.getElementById("wallets");

const fetchBtn =
    document.getElementById("fetchBtn");

const grandTotal =
    document.getElementById("grandTotal");

const usdTotal =
    document.getElementById("usdTotal");

const solPrice =
    document.getElementById("solPrice");

const status =
    document.getElementById("status");


async function rpc(method, params) {

    const response = await fetch(RPC, {
        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            jsonrpc: "2.0",
            id: 1,
            method,
            params
        })
    });

    const data = await response.json();

    if (data.error) {
        throw new Error(data.error.message);
    }

    return data.result;
}


function formatSOL(value) {
    return value.toFixed(6);
}


function formatUSD(value) {

    return value.toLocaleString("en-US", {
        style: "currency",
        currency: "USD",
        maximumFractionDigits: 2
    });

}


async function getSOLPrice() {

    const response = await fetch(
        "https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=usd"
    );

    if (!response.ok) {
        throw new Error("Could not fetch SOL price");
    }

    const data = await response.json();

    return data.solana.usd;
}


async function fetchBalances() {

    fetchBtn.disabled = true;
    fetchBtn.textContent = "LOADING...";

    status.textContent =
        "Scanning wallets...";

    try {

        const addresses =
            wallets.map(w => w.publicKey);


        // One request for all native SOL accounts.
        const solResult =
            await rpc("getMultipleAccounts", [
                addresses,
                {
                    encoding: "base64"
                }
            ]);


        // Fetch WSOL balances.
        const wsolResults =
            await Promise.all(
                wallets.map(wallet =>
                    rpc("getTokenAccountsByOwner", [
                        wallet.publicKey,
                        {
                            mint: WSOL_MINT
                        },
                        {
                            encoding: "jsonParsed"
                        }
                    ])
                )
            );


        // Get current SOL/USD price.
        const price =
            await getSOLPrice();

        solPrice.textContent =
            formatUSD(price);


        let grandTotalSOL = 0;

        let mainSOL = 0;

        walletsContainer.innerHTML = "";


        wallets.forEach((wallet, i) => {

            const account =
                solResult.value[i];


            const sol =
                account
                    ? account.lamports / 1_000_000_000
                    : 0;


            let wsol = 0;


            const tokenResult =
                wsolResults[i];


            if (tokenResult && tokenResult.value) {

                for (const tokenAccount of tokenResult.value) {

                    const amount =
                        tokenAccount.account.data.parsed.info
                            .tokenAmount.uiAmount;

                    wsol += amount || 0;

                }

            }


            const total =
                sol + wsol;


            grandTotalSOL += total;


            if (wallet.index === "MAIN") {
                mainSOL = sol;
            }


            const isMain =
                wallet.index === "MAIN";


            const statusClass =
                isMain
                    ? "main"
                    : wsol >= 0.5
                        ? "safe"
                        : "low";


            const badge =
                isMain
                    ? "PRIMARY"
                    : wsol >= 0.5
                        ? "WSOL OK"
                        : "WSOL LOW";


            const div =
                document.createElement("div");


            div.className =
                `wallet ${statusClass}`;


            div.innerHTML = `

                <div class="wallet-top">

                    <div class="wallet-name">
                        ${isMain ? "MAIN WALLET" : `WALLET ${wallet.index}`}
                    </div>

                    <div class="badge">
                        ${badge}
                    </div>

                </div>


                <div class="pubkey">
                    ${wallet.publicKey}
                </div>


                <div class="balances">

                    <div class="balance-box">
                        <div class="balance-label">
                            SOL
                        </div>

                        <div class="balance-value">
                            ${formatSOL(sol)}
                        </div>
                    </div>


                    <div class="balance-box">
                        <div class="balance-label">
                            WSOL
                        </div>

                        <div class="balance-value">
                            ${formatSOL(wsol)}
                        </div>
                    </div>


                    <div class="balance-box">
                        <div class="balance-label">
                            TOTAL
                        </div>

                        <div class="balance-value">
                            ${formatSOL(total)}
                        </div>
                    </div>

                </div>


                <div class="wallet-usd">
                    ${formatUSD(total * price)}
                </div>

            `;


            walletsContainer.appendChild(div);

        });


        grandTotal.textContent =
            `${formatSOL(grandTotalSOL)} SOL`;


        usdTotal.textContent =
            formatUSD(grandTotalSOL * price);


        status.textContent =
            `LIVE • Updated ${new Date().toLocaleTimeString()}`;


    } catch (error) {

        console.error(error);

        status.textContent =
            `ERROR • ${error.message}`;

    }


    fetchBtn.disabled = false;
    fetchBtn.textContent = "↻ REFRESH";

}


fetchBtn.addEventListener(
    "click",
    fetchBalances
);

</script>

</body>
</html>
