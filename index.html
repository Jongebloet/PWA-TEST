<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.webmanifest">

    <meta name="theme-color" content="#111111">

    <title>Solana Wallet</title>
</head>

<body>

    <h1>Solana Wallet</h1>

    <button id="balanceBtn">Fetch SOL Balance</button>

    <h2 id="balance">---</h2>

    <script>
        const WALLET = "nigger24aL9gzjedPYg8kCACtYiWrjDiiBiUptCiXZ6";

        const RPC =
            "https://mainnet.helius-rpc.com/?api-key=effd806d-2126-4b17-b69d-a68f37ace363";

        document.getElementById("balanceBtn").addEventListener("click", async () => {
            const balanceElement = document.getElementById("balance");

            balanceElement.textContent = "Loading...";

            try {
                const response = await fetch(RPC, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        jsonrpc: "2.0",
                        id: 1,
                        method: "getBalance",
                        params: [WALLET]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                const lamports = data.result.value;
                const sol = lamports / 1_000_000_000;

                balanceElement.textContent = `${sol} SOL`;

            } catch (error) {
                console.error(error);
                balanceElement.textContent = `Error: ${error.message}`;
            }
        });
    </script>

</body>
</html>
