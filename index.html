<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#080b12">

<link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.8/themes/odometer-theme-default.min.css">

<title>Solana Command Center</title>

<style>
    * {
        box-sizing: border-box
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, Arial, sans-serif;
        background: radial-gradient(circle at 20% 0%, #17213a 0, transparent 35%),
            radial-gradient(circle at 90% 20%, #24143b 0, transparent 30%),
            #080b12;
        color: #f5f7ff
    }

    body:before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
            linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: linear-gradient(to bottom, #000, transparent)
    }

    .container {
        width: min(1100px, calc(100% - 28px));
        margin: auto;
        padding: 35px 0 60px
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 28px
    }

    .title {
        font-size: clamp(28px, 6vw, 48px);
        font-weight: 800;
        letter-spacing: -2px;
        margin: 0
    }

    .subtitle {
        color: #7e8aa8;
        margin-top: 7px;
        font-size: 14px
    }

    button {
        border: 1px solid rgba(255, 255, 255, .12);
        border-radius: 12px;
        padding: 13px 19px;
        color: #fff;
        background: rgba(255, 255, 255, .07);
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        backdrop-filter: blur(15px);
        transition: .2s
    }

    button:hover {
        background: rgba(255, 255, 255, .13);
        transform: translateY(-1px)
    }

    button:disabled {
        opacity: .5;
        cursor: wait
    }

    .hero {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, .1);
        border-radius: 24px;
        padding: 30px;
        margin-bottom: 25px;
        background: linear-gradient(135deg, rgba(30, 40, 70, .75), rgba(15, 18, 30, .72));
        box-shadow: 0 25px 80px rgba(0, 0, 0, .35);
        backdrop-filter: blur(20px)
    }

    .hero:after {
        content: "";
        position: absolute;
        width: 250px;
        height: 250px;
        right: -100px;
        top: -120px;
        background: #6d4aff;
        filter: blur(100px);
        opacity: .22
    }

    .hero-label {
        color: #8995b3;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 2px
    }

    .grand-total {
        font-size: clamp(38px, 9vw, 68px);
        font-weight: 800;
        letter-spacing: -3px;
        margin: 8px 0
    }

    .usd-total {
        font-size: 20px;
        color: #9da9c4
    }

    #grandTotal,
    #usdTotalOdometer {
        display: inline-block
    }

    .grand-total .odometer,
    .usd-total .odometer {
        font-size: inherit
    }

    .odometer.odometer-animating-up .odometer-ribbon-inner,
    .odometer.odometer-animating-down .odometer-ribbon-inner {
        transition-duration: 10s !important
    }

    .stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 25px
    }

    .stat {
        background: rgba(255, 255, 255, .045);
        border: 1px solid rgba(255, 255, 255, .07);
        border-radius: 14px;
        padding: 14px
    }

    .stat-label {
        color: #7d89a5;
        font-size: 12px
    }

    .stat-value {
        margin-top: 5px;
        font-size: 18px;
        font-weight: 700
    }

    .wallet-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 14px
    }

    .wallet {
        position: relative;
        overflow: hidden;
        border-radius: 18px;
        padding: 19px;
        background: rgba(17, 21, 32, .82);
        border: 1px solid rgba(255, 255, 255, .075);
        box-shadow: 0 10px 35px rgba(0, 0, 0, .2);
        transition: .2s
    }

    .wallet:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, .16)
    }

    .wallet.main {
        grid-column: 1/-1;
        background: linear-gradient(135deg, rgba(48, 37, 86, .8), rgba(17, 21, 32, .9));
        border-color: rgba(143, 111, 255, .35)
    }

    .wallet.safe {
        border-left: 3px solid #25e69a
    }

    .wallet.low {
        border-left: 3px solid #ff426d
    }

    .wallet-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px
    }

    .wallet-name {
        font-size: 17px;
        font-weight: 800
    }

    .badge {
        font-size: 10px;
        padding: 5px 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, .07);
        color: #aab4ca;
        text-transform: uppercase;
        letter-spacing: 1px
    }

    .safe .badge {
        color: #25e69a;
        background: rgba(37, 230, 154, .08)
    }

    .low .badge {
        color: #ff426d;
        background: rgba(255, 66, 109, .08)
    }

    .pubkey {
        margin: 10px 0 18px;
        color: #626d87;
        font-size: 10px;
        word-break: break-all
    }

    .balances {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto auto;
        gap: 8px
    }

    .balance-box {
        padding: 11px;
        border-radius: 11px;
        background: rgba(255, 255, 255, .035)
    }

    .balance-label {
        color: #707b95;
        font-size: 10px;
        text-transform: uppercase
    }

    .balance-value {
        margin-top: 5px;
        font-size: 13px;
        font-weight: 700
    }

    .balance-usd {
        grid-column: 1;
        grid-row: 3;
        align-self: center;
        padding: 11px 0;
        color: #8d99b5;
        font-size: 13px;
        font-weight: 700
    }

    .balance-total {
        grid-column: 2;
        grid-row: 3
    }

    .closes-sub {
        margin-top: 3px;
        color: #626d87;
        font-size: 10px
    }

    .wallet-usd {
        margin-top: 13px;
        color: #8d99b5;
        font-size: 13px
    }

    .status {
        margin-top: 20px;
        color: #69748e;
        font-size: 11px
    }

    @media(max-width:600px) {
        .container {
            padding-top: 20px
        }

        .header {
            align-items: flex-start
        }

        .header button {
            padding: 11px;
            font-size: 12px
        }

        .hero {
            padding: 22px
        }

        .wallet.main {
            grid-column: auto
        }
    }
</style>

</head>

    const delay =
        ms => new Promise(r => setTimeout(r, ms));

    async function rpc(method, params, debugName = "") {

        await delay(200);

        const keyIndex =
            rpcIndex++ % RPC_KEYS.length;

        const key =
            RPC_KEYS[keyIndex];

        try {

            const response =
                await fetch(
                    RPC_BASE + key,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            jsonrpc: "2.0",
                            id: 1,
                            method,
                            params
                        })
                    }
                );

            const data =
                await response.json();

            if (data.error) {

                console.error(
                    `RPC FAILED: ${debugName || method}`,
                    {
                        method,
                        params,
                        error: data.error,
                        rpcKey: keyIndex
                    }
                );

                throw new Error(
                    `${debugName || method}: ${data.error.message}`
                );
            }

            return data.result;

        } catch (error) {

            console.error(
                `RPC EXCEPTION: ${debugName || method}`,
                error
            );

            throw error;
        }
    }

    function validateAddress(address, label) {

        try {

            new solanaWeb3.PublicKey(address);

            return true;

        } catch (e) {

            console.error(
                `INVALID ADDRESS: ${label}`,
                address,
                e
            );

            return false;
        }
    }

    function decodeTokenAmount(account) {

        if (!account?.data?.[0])
            return 0;

        const binary =
            atob(account.data[0]);

        const bytes =
            Uint8Array.from(
                binary,
                c => c.charCodeAt(0)
            );

        if (bytes.length < 72)
            return 0;

        return Number(
            new DataView(bytes.buffer)
                .getBigUint64(64, true)
        ) / 1e9;
    }

    const formatSOL =
        v => v.toFixed(6);

    const formatUSD =
        v =>
            v.toLocaleString(
                "en-US",
                {
                    style: "currency",
                    currency: "USD",
                    maximumFractionDigits: 2
                }
            );

    async function getSOLPrice() {

        const r =
            await fetch(
                "https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=usd"
            );

        if (!r.ok)
            throw new Error(
                "Could not fetch SOL price"
            );

        return (
            await r.json()
        ).solana.usd;
    }

    async function getCloseStats(wallet) {

        const results =
            await Promise.all(
                [
                    TOKEN_PROGRAM_ID,
                    TOKEN_2022_PROGRAM_ID
                ].map(
                    program =>
                        rpc(
                            "getTokenAccountsByOwner",
                            [
                                wallet.publicKey,
                                {
                                    programId: program
                                },
                                {
                                    encoding: "jsonParsed"
                                }
                            ],
                            `WALLET ${wallet.index} CLOSES / ${
                                program === TOKEN_PROGRAM_ID
                                    ? "SPL"
                                    : "TOKEN-2022"
                            }`
                        )
                )
            );

        let accounts = 0;
        let lamports = 0;

        for (const result of results) {

            for (const account of result.value) {

                const info =
                    account.account.data.parsed.info;

                if (SKIP.has(info.mint))
                    continue;

                if (
                    BigInt(
                        info.tokenAmount.amount
                    ) === 0n
                ) {

                    accounts++;

                    lamports +=
                        account.account.lamports;
                }
            }
        }

        return {
            accounts,
            sol: lamports / 1e9
        };
    }

    async function fetchBalances() {

        fetchBtn.disabled = true;
        fetchBtn.textContent = "LOADING...";
        status.textContent = "Scanning wallets...";

        try {

            console.log(
                "========== WALLET VALIDATION =========="
            );

            for (const wallet of wallets) {

                if (
                    !validateAddress(
                        wallet.publicKey,
                        `WALLET ${wallet.index}`
                    )
                ) {

                    throw new Error(
                        `INVALID PUBLIC KEY: WALLET ${wallet.index} ${wallet.publicKey}`
                    );
                }

                if (
                    wallet.cashbackATA &&
                    !validateAddress(
                        wallet.cashbackATA,
                        `WALLET ${wallet.index} CASHBACK ATA`
                    )
                ) {

                    throw new Error(
                        `INVALID CASHBACK ATA: WALLET ${wallet.index} ${wallet.cashbackATA}`
                    );
                }
            }

            console.log(
                "========== ALL ADDRESSES PASSED =========="
            );

            const addresses =
                wallets.map(
                    w => w.publicKey
                );

            const solResult =
                await rpc(
                    "getMultipleAccounts",
                    [
                        addresses,
                        {
                            encoding: "base64"
                        }
                    ],
                    `SOL BALANCES - ALL ${wallets.length} WALLETS`
                );

            const wsolResults =
                await Promise.all(
                    wallets.map(
                        w =>
                            w.index === "MAIN"
                                ? null
                                : rpc(
                                    "getTokenAccountsByOwner",
                                    [
                                        w.publicKey,
                                        {
                                            mint: WSOL_MINT
                                        },
                                        {
                                            encoding: "jsonParsed"
                                        }
                                    ],
                                    `WALLET ${w.index} WSOL`
                                )
                    )
                );

            const cashbackWallets =
                wallets.filter(
                    w => w.cashbackATA
                );

            const cashbackResult =
                await rpc(
                    "getMultipleAccounts",
                    [
                        cashbackWallets.map(
                            w => w.cashbackATA
                        ),
                        {
                            encoding: "base64"
                        }
                    ],
                    "ALL CASHBACK ATAs"
                );

            const cashbackMap =
                new Map(
                    cashbackWallets.map(
                        (w, i) => [
                            w.cashbackATA,
                            decodeTokenAmount(
                                cashbackResult.value[i]
                            )
                        ]
                    )
                );

            const price =
                await getSOLPrice();

            solPrice.textContent =
                formatUSD(price);

            const closeStats =
                await Promise.all(
                    wallets.map(
                        w =>
                            w.index === "MAIN"
                                ? null
                                : getCloseStats(w)
                    )
                );

            let grandTotalSOL = 0;

            walletsContainer.innerHTML = "";

            wallets.forEach(
                (wallet, i) => {

                    const account =
                        solResult.value[i];

                    const sol =
                        account
                            ? account.lamports / 1e9
                            : 0;

                    let wsol = 0;

                    const tokenResult =
                        wsolResults[i];

                    if (tokenResult?.value) {

                        for (
                            const a
                            of tokenResult.value
                        ) {

                            wsol +=
                                a.account
                                    .data
                                    .parsed
                                    .info
                                    .tokenAmount
                                    .uiAmount || 0;
                        }
                    }

                    const cashback =
                        wallet.cashbackATA
                            ? cashbackMap.get(
                                wallet.cashbackATA
                            ) || 0
                            : 0;

                    const isMain =
                        wallet.index === "MAIN";

                    /*
                     * CLOSES are claimable SOL from
                     * empty token accounts.
                     *
                     * stats.sol is already:
                     * account lamports / 1e9
                     */
                    const stats =
                        isMain
                            ? null
                            : closeStats[i];

                    const closes =
                        stats
                            ? stats.sol
                            : 0;

                    /*
                     * IMPORTANT:
                     * Portfolio total includes:
                     *
                     * SOL
                     * + WSOL
                     * + CASHBACK
                     * + CLOSES
                     */
                    const total =
                        sol +
                        wsol +
                        cashback +
                        closes;

                    grandTotalSOL +=
                        total;

                    const statusClass =
                        isMain
                            ? "main"
                            : wsol >= .5
                                ? "safe"
                                : "low";

                    const badge =
                        isMain
                            ? "PRIMARY"
                            : wsol >= .5
                                ? "WSOL OK"
                                : "WSOL LOW";

                    const div =
                        document.createElement(
                            "div"
                        );

                    div.className =
                        `wallet ${statusClass}`;

                    if (isMain) {

                        div.innerHTML = `
                            <div class="wallet-top">
                                <div class="wallet-name">
                                    MAIN WALLET
                                </div>

                                <div class="badge">
                                    PRIMARY
                                </div>
                            </div>

                            <div class="pubkey">
                                ${wallet.publicKey}
                            </div>

                            <div class="balances">

                                <div class="balance-box">
                                    <div class="balance-label">
                                        SOL
                                    </div>

                                    <div class="balance-value">
                                        ${formatSOL(sol)}
                                    </div>
                                </div>

                                <div class="balance-box">
                                    <div class="balance-label">
                                        TOTAL
                                    </div>

                                    <div class="balance-value">
                                        ${formatSOL(total)}
                                    </div>
                                </div>

                            </div>

                            <div class="wallet-usd">
                                ${formatUSD(total * price)}
                            </div>
                        `;

                    } else {

                        div.innerHTML = `
                            <div class="wallet-top">

                                <div class="wallet-name">
                                    WALLET ${wallet.index}
                                </div>

                                <div class="badge">
                                    ${badge}
                                </div>

                            </div>

                            <div class="pubkey">
                                ${wallet.publicKey}
                            </div>

                            <div class="balances">

                                <div class="balance-box">

                                    <div class="balance-label">
                                        SOL
                                    </div>

                                    <div class="balance-value">
                                        ${formatSOL(sol)}
                                    </div>

                                </div>

                                <div class="balance-box">

                                    <div class="balance-label">
                                        WSOL
                                    </div>

                                    <div class="balance-value">
                                        ${formatSOL(wsol)}
                                    </div>

                                </div>

                                <div class="balance-box">

                                    <div class="balance-label">
                                        CLOSES
                                    </div>

                                    <div class="balance-value">
                                        ${formatSOL(closes)} SOL
                                    </div>

                                    <div class="closes-sub">
                                        ${stats.accounts} accounts
                                    </div>

                                </div>

                                <div class="balance-box">

                                    <div class="balance-label">
                                        CASHBACK
                                    </div>

                                    <div class="balance-value">
                                        ${formatSOL(cashback)}
                                    </div>

                                </div>

                                <div class="balance-box balance-total">

                                    <div class="balance-label">
                                        TOTAL
                                    </div>

                                    <div class="balance-value">
                                        ${formatSOL(total)}
                                    </div>

                                </div>

                                <div class="balance-usd">
                                    ${formatUSD(total * price)}
                                </div>

                            </div>
                        `;
                    }

                    walletsContainer.appendChild(div);
                }
            );

            updatePortfolioOdometers(
                grandTotalSOL,
                grandTotalSOL * price
            );

            status.textContent =
                `LIVE • Updated ${new Date().toLocaleTimeString()}`;

        } catch (error) {

            console.error(
                "========== FETCH FAILED =========="
            );

            console.error(error);

            status.textContent =
                `ERROR • ${error.message}`;
        }

        fetchBtn.disabled = false;
        fetchBtn.textContent = "↻ REFRESH";
    }

    function updatePortfolioOdometers(
        sol,
        usd
    ) {

        grandTotalOdometer.update(sol);
        usdTotalOdometer.update(usd);
    }

    fetchBtn.addEventListener(
        "click",
        fetchBalances
    );

    fetchBalances();

</script>

</body>

</html>
